name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version-bump check diffs against the base branch
          persist-credentials: false

      # pnpm and Node.js come from the scaffold's devEngines, so the scaffold owns the versions.
      # No install here: check_snippets.py installs into its copy outside the repository.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: skills/frontend-scaffolding/assets/app
          install: false
          cache: true
          cache-dependency-path: skills/frontend-scaffolding/assets/app/pnpm-lock.yaml

      - run: python3 scripts/validate_skills.py --strict
        if: github.event_name != 'pull_request'
      # A change under skills/ must bump the plugin version: installed plugins update only on a version change.
      - run: python3 scripts/validate_skills.py --strict --base origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: python3 -B scripts/test_validate_skills.py
      - run: pnpm dlx @j178/prek@0.5.11 run --all-files --config .pre-commit-config.yaml
      # Needs no credentials: it checks the manifests, the marketplace file and each SKILL.md's YAML.
      - run: pnpm dlx @anthropic-ai/claude-code@2.1.328 plugin validate --strict .
      - run: python3 scripts/check_snippets.py

  # The template's own gate, as a new app's CI runs it. The copy sits beside the checkout, outside the repository.
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      PUBLIC_API_ORIGIN: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - run: cp -R repo/skills/frontend-scaffolding/assets/app app

      # Installs the pnpm and Node.js that devEngines pins, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: app
          cache: true
          require-lockfile: true

      - working-directory: app
        run: pnpm dedupe --check
      - working-directory: app
        run: pnpm check
      - working-directory: app
        run: pnpm test:coverage
      # The committed client must be what openapi.json generates.
      - working-directory: app
        run: |
          cp -R src/api/generated "$RUNNER_TEMP/generated-committed"
          pnpm api:generate
          diff -r "$RUNNER_TEMP/generated-committed" src/api/generated
      - working-directory: app
        run: pnpm build
      - working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: app
        run: pnpm test:e2e
      - run: docker build --build-arg PUBLIC_API_ORIGIN="$PUBLIC_API_ORIGIN" --tag scaffold-check app
